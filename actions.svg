<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 540" role="img" aria-labelledby="title desc">
  <title id="title">Assignable touchpad controls</title>
  <desc id="desc">Each touchpad region can have separate tap, hold, and fling actions.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#102848"/><stop offset="1" stop-color="#07142a"/></linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%"><feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#000" flood-opacity=".28"/></filter>
    <clipPath id="padClip"><rect x="74" y="105" width="276" height="330" rx="38"/></clipPath>
  </defs>
  <rect width="800" height="540" rx="36" fill="url(#bg)"/>
  <path d="M0 120h800M0 270h800M0 420h800M160 0v540M400 0v540M640 0v540" stroke="#fff" stroke-opacity=".025"/>

  <g filter="url(#shadow)">
    <rect x="74" y="105" width="276" height="330" rx="38" fill="#142a47" fill-opacity=".78" stroke="#718399" stroke-width="2"/>
    <g clip-path="url(#padClip)">
      <path d="M40 65 384 475M384 65 40 475" stroke="#fff" stroke-opacity=".17" stroke-width="2"/>
    </g>
    <text x="212" y="148" text-anchor="middle" fill="#aebdd0" font-family="system-ui,sans-serif" font-size="15" font-weight="700">TOP</text>
    <text x="212" y="404" text-anchor="middle" fill="#aebdd0" font-family="system-ui,sans-serif" font-size="15" font-weight="700">BOTTOM</text>
    <text x="103" y="276" fill="#aebdd0" font-family="system-ui,sans-serif" font-size="15" font-weight="700">LEFT</text>
    <text x="275" y="276" fill="#aebdd0" font-family="system-ui,sans-serif" font-size="15" font-weight="700">RIGHT</text>
    <rect x="157" y="215" width="110" height="110" rx="28" fill="#2478ff" stroke="#fff" stroke-opacity=".35" stroke-width="2"/>
    <text x="212" y="276" text-anchor="middle" fill="#fff" font-family="system-ui,sans-serif" font-size="16" font-weight="800">CENTER</text>
  </g>

  <path d="M350 270h34M384 191v158M384 191h26M384 270h26M384 349h26" fill="none" stroke="#63e6dc" stroke-opacity=".55" stroke-width="2" stroke-dasharray="4 6"/>

  <g font-family="system-ui,sans-serif">
    <text x="410" y="131" fill="#63e6dc" font-size="13" font-weight="800" letter-spacing="2">FOR EVERY REGION</text>
    <g transform="translate(410 154)">
      <rect width="318" height="74" rx="19" fill="#fff" fill-opacity=".08" stroke="#fff" stroke-opacity=".12"/>
      <rect x="16" y="20" width="74" height="34" rx="17" fill="#2478ff"/>
      <text x="53" y="42" text-anchor="middle" fill="#fff" font-size="14" font-weight="800">TAP</text>
      <text x="110" y="35" fill="#8fa3b9" font-size="11" font-weight="700">ASSIGN</text>
      <text x="110" y="53" fill="#eef5fc" font-size="15" font-weight="700">Tap · Back · Home</text>
    </g>
    <g transform="translate(410 233)">
      <rect width="318" height="74" rx="19" fill="#fff" fill-opacity=".08" stroke="#fff" stroke-opacity=".12"/>
      <rect x="16" y="20" width="74" height="34" rx="17" fill="#38a7e7"/>
      <text x="53" y="42" text-anchor="middle" fill="#fff" font-size="14" font-weight="800">HOLD</text>
      <text x="110" y="35" fill="#8fa3b9" font-size="11" font-weight="700">ASSIGN</text>
      <text x="110" y="53" fill="#eef5fc" font-size="15" font-weight="700">Long press</text>
    </g>
    <g transform="translate(410 312)">
      <rect width="318" height="74" rx="19" fill="#fff" fill-opacity=".08" stroke="#fff" stroke-opacity=".12"/>
      <rect x="16" y="20" width="74" height="34" rx="17" fill="#63e6dc"/>
      <text x="53" y="42" text-anchor="middle" fill="#07162d" font-size="14" font-weight="800">FLING</text>
      <text x="110" y="35" fill="#8fa3b9" font-size="11" font-weight="700">ASSIGN</text>
      <text x="110" y="53" fill="#eef5fc" font-size="15" font-weight="700">Scroll · Swipe</text>
    </g>
  </g>
</svg>
