<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 140" role="img" aria-labelledby="title desc">
  <title id="title">Touchpad position mapping</title><desc id="desc">A small dot in the top-left of a touchpad maps to a larger cursor dot in the top-left of a vertical phone screen, with a dotted trail from the phone's top-right.</desc>
  <rect width="240" height="140" rx="18" fill="#f3f8fc"/>
  <rect x="76" y="10" width="88" height="120" rx="15" fill="white" stroke="#17304f" stroke-width="3"/>
  <rect x="108" y="76" width="40" height="40" rx="7" fill="#dcecf7" stroke="#2478ff" stroke-width="3"/>
  <circle cx="116" cy="84" r="4" fill="#2478ff"/>
  <path d="M151 28 C132 27 111 30 98 34" fill="none" stroke="#55d8df" stroke-width="3" stroke-dasharray="1 6" stroke-linecap="round"/>
  <circle cx="91" cy="34" r="11" fill="#55d8df" stroke="#17304f" stroke-width="2"/>
</svg>
