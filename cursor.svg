<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 540" role="img" aria-labelledby="title desc">
  <title id="title">Moving the Scrool cursor</title>
  <desc id="desc">A short dotted movement on the touchpad becomes a larger matching cursor movement on the phone.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="1" x2="1" y2="0"><stop stop-color="#e6fbf8"/><stop offset="1" stop-color="#eff5ff"/></linearGradient>
    <filter id="shadow" x="-40%" y="-40%" width="180%" height="190%"><feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#0b1830" flood-opacity=".2"/></filter>
  </defs>
  <rect width="800" height="540" rx="36" fill="url(#bg)"/>
  <g filter="url(#shadow)">
    <rect x="224" y="16" width="352" height="508" rx="54" fill="#07111f"/>
    <rect x="236" y="28" width="328" height="484" rx="43" fill="#fff"/>
  </g>
  <circle cx="400" cy="48" r="9" fill="#07111f"/>
  <rect x="264" y="76" width="126" height="13" rx="6.5" fill="#aebfcd"/>
  <circle cx="528" cy="83" r="15" fill="#dceaf7"/>
  <rect x="264" y="118" width="272" height="80" rx="18" fill="#eef4f8"/>
  <rect x="264" y="216" width="126" height="73" rx="17" fill="#edf5ff"/>
  <rect x="408" y="216" width="128" height="73" rx="17" fill="#eff8f6"/>
  <rect x="264" y="307" width="272" height="160" rx="20" fill="#f4f7f9"/>
  <!-- The cursor follows a scaled-up version of the movement made on the pad. -->
  <path d="M302 389C346 352 380 307 414 246S474 153 505 126" fill="none" stroke="#2478ff" stroke-opacity=".55" stroke-width="5" stroke-linecap="round" stroke-dasharray="2 15"/>
  <circle cx="505" cy="126" r="34" fill="none" stroke="#2478ff" stroke-opacity=".14" stroke-width="12"/>
  <g filter="url(#shadow)">
    <circle cx="505" cy="126" r="16" fill="#2478ff" stroke="#fff" stroke-width="5"/>
  </g>
  <g transform="translate(585 82)">
    <rect width="142" height="38" rx="19" fill="#fff" stroke="#c9d9e5"/>
    <circle cx="21" cy="19" r="5" fill="#2478ff"/>
    <text x="36" y="24" fill="#263a53" font-family="system-ui,sans-serif" font-size="14" font-weight="700">CURSOR</text>
  </g>
  <path d="M585 112 525 126" stroke="#8fa8ba" stroke-width="2" stroke-dasharray="4 5"/>
  <!-- Transparent touchpad with the same path at a smaller scale. -->
  <g filter="url(#shadow)">
    <rect x="286" y="334" width="174" height="150" rx="26" fill="#0a1a34" fill-opacity=".76" stroke="#8498ac" stroke-width="2"/>
    <path d="M287 335 459 483M459 335 287 483" stroke="#fff" stroke-opacity=".18" stroke-width="2"/>
    <rect x="347" y="386" width="52" height="52" rx="14" fill="#2478ff" stroke="#fff" stroke-opacity=".4"/>
    <path d="M311 448C330 433 346 416 360 398S386 369 412 352" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-dasharray="2 11"/>
  </g>
  <g transform="translate(585 235)">
    <rect width="150" height="70" rx="20" fill="#fff" stroke="#cfdae3"/>
    <text x="20" y="29" fill="#6b7890" font-family="system-ui,sans-serif" font-size="12" font-weight="700">SMALL MOTION</text>
    <text x="20" y="51" fill="#0b1830" font-family="system-ui,sans-serif" font-size="15" font-weight="800">FULL REACH</text>
  </g>
</svg>
