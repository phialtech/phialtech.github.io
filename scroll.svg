<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 540" role="img" aria-labelledby="title desc">
  <title id="title">Scrolling with Scrool</title>
  <desc id="desc">Tapping the bottom zone of the touchpad sends an upward swipe across the phone screen.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#edf5ff"/><stop offset="1" stop-color="#e8fbf8"/></linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#2478ff"/></marker>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%"><feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#0b1830" flood-opacity=".18"/></filter>
  </defs>
  <rect width="800" height="540" rx="36" fill="url(#bg)"/>
  <g filter="url(#shadow)">
    <rect x="224" y="16" width="352" height="508" rx="54" fill="#07111f"/>
    <rect x="236" y="28" width="328" height="484" rx="43" fill="#fff"/>
  </g>
  <circle cx="400" cy="48" r="9" fill="#07111f"/>
  <rect x="264" y="76" width="126" height="13" rx="6.5" fill="#aebfcd"/>
  <g>
    <rect x="264" y="116" width="272" height="82" rx="18" fill="#eef4f8"/>
    <rect x="281" y="133" width="58" height="48" rx="12" fill="#d7e8f7"/>
    <rect x="354" y="138" width="114" height="9" rx="4.5" fill="#9dafbe"/>
    <rect x="354" y="158" width="148" height="7" rx="3.5" fill="#c6d1da"/>
    <rect x="354" y="174" width="92" height="7" rx="3.5" fill="#d7dfe5"/>
  </g>
  <g>
    <rect x="264" y="215" width="272" height="82" rx="18" fill="#eef4f8"/>
    <rect x="281" y="232" width="58" height="48" rx="12" fill="#dff4ef"/>
    <rect x="354" y="237" width="114" height="9" rx="4.5" fill="#9dafbe"/>
    <rect x="354" y="257" width="148" height="7" rx="3.5" fill="#c6d1da"/>
    <rect x="354" y="273" width="92" height="7" rx="3.5" fill="#d7dfe5"/>
  </g>
  <!-- The resulting swipe happens on the screen, above the touchpad. -->
  <path d="M300 283C292 244 293 198 301 151" fill="none" stroke="#2478ff" stroke-width="7" stroke-linecap="round" marker-end="url(#arrow)"/>
  <circle cx="300" cy="283" r="9" fill="#2478ff"/>
  <g transform="translate(92 148)">
    <rect width="112" height="44" rx="22" fill="#fff" stroke="#cbd9e4"/>
    <circle cx="22" cy="22" r="11" fill="#2478ff"/>
    <text x="22" y="26" text-anchor="middle" fill="#fff" font-family="system-ui,sans-serif" font-size="12" font-weight="800">2</text>
    <text x="44" y="27" fill="#263a53" font-family="system-ui,sans-serif" font-size="14" font-weight="800">SWIPE</text>
  </g>
  <path d="M204 170h64" stroke="#91a6b8" stroke-width="2" stroke-dasharray="4 5"/>
  <!-- Tap the bottom zone of the transparent touchpad. -->
  <g filter="url(#shadow)">
    <rect x="347" y="301" width="184" height="184" rx="29" fill="#0a1a34" fill-opacity=".76" stroke="#8498ac" stroke-width="2"/>
    <path d="M348 302 530 484M530 302 348 484" stroke="#fff" stroke-opacity=".18" stroke-width="2"/>
    <rect x="410" y="364" width="58" height="58" rx="15" fill="#2478ff" stroke="#fff" stroke-opacity=".4"/>
    <circle cx="439" cy="452" r="26" fill="#63e6dc" fill-opacity=".16" stroke="#63e6dc" stroke-opacity=".55" stroke-width="2"/>
    <circle cx="439" cy="452" r="10" fill="#63e6dc"/>
  </g>
  <g transform="translate(576 405)">
    <rect width="112" height="44" rx="22" fill="#fff" stroke="#cbd9e4"/>
    <circle cx="22" cy="22" r="11" fill="#63e6dc"/>
    <text x="22" y="26" text-anchor="middle" fill="#07162d" font-family="system-ui,sans-serif" font-size="12" font-weight="800">1</text>
    <text x="44" y="27" fill="#263a53" font-family="system-ui,sans-serif" font-size="14" font-weight="800">TAP</text>
  </g>
  <path d="M576 427 468 450" stroke="#91a6b8" stroke-width="2" stroke-dasharray="4 5"/>
</svg>
